<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>File drop</title>
<style>
:root{--bg:#e9eef0;--surface:#f8fafb;--ink:#1b2b34;--mute:#5d6f79;--line:#c9d4d9;--accent:#f2a900;--ok:#1e8e5a;--err:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10181d;--surface:#18232a;--ink:#e6eef1;--mute:#93a5ae;--line:#2c3c45;--accent:#f2b630;--ok:#4cc38a;--err:#ff7b6b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:600px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top,0px)) 18px calc(50px + env(safe-area-inset-bottom,0px))}
h1{font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}.lead{color:var(--mute);margin:0 0 20px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}
button,label.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;padding:11px 16px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);-webkit-appearance:none;display:inline-block;text-align:center}
button.on,button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}button.go{background:var(--accent);color:#1b2b34;border-color:var(--accent)}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=password]{width:100%;font:inherit;padding:11px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px}
#codeIn{font:800 1.8rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;text-align:center}
.drop{text-align:center;border:2px dashed var(--line);border-radius:14px;padding:26px 14px;font-weight:600;margin-top:4px}.drop.over{border-color:var(--accent)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.msg{min-height:1.4em;color:var(--mute);margin:8px 0}.msg.err{color:var(--err)}.hidden{display:none!important}
.code{font:800 clamp(2.4rem,12vw,3.6rem)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;margin:10px 0}
ul{list-style:none;margin:0;padding:0}li{padding:10px 0;border-top:1px solid var(--line)}li:first-child{border-top:0}
.name{font-weight:600;word-break:break-all}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:.88rem}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--accent)}
a{color:var(--ink);font-weight:600}h2{font-size:1.1rem;margin:0 0 8px}
</style></head><body><main>
<h1>File drop</h1><p class="lead">Publish files once. Your friend downloads them as normal with a 6-digit code once publishing finishes.</p>
<div id="srvNote" class="msg err hidden" role="alert"></div>
<div class="tabs"><button id="tS" class="on">Send</button><button id="tR">Receive</button></div>

<section id="send" class="panel">
  <input type="password" id="pw" placeholder="Upload password" autocomplete="current-password" aria-label="Upload password">
  <div class="drop" id="drop"><span id="dropTxt">Drop files or folders here</span>
    <div class="row"><label class="btn">Choose files<input type="file" id="files" multiple></label><label class="btn" id="dirBtn">Choose folder<input type="file" id="dir" webkitdirectory></label></div></div>
  <div id="sMsg" class="msg" role="status"></div>
  <div id="done" class="hidden"><h2>Give your friend this code</h2><div class="code" id="codeOut"></div>
    <div id="doneNote" class="msg"></div>
    <div class="row" style="justify-content:flex-start"><button id="cp">Copy link</button></div></div>
  <ul id="up"></ul>
</section>

<section id="recv" class="panel hidden">
  <input type="text" id="codeIn" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" aria-label="6-digit code">
  <button class="go" id="look">Show files</button>
  <div id="rMsg" class="msg" role="status"></div>
  <div id="zipRow" class="hidden"><a id="zipA" href="#"><button class="primary">Download all as .zip</button></a></div>
  <ul id="down"></ul>
</section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function fmt(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB'}
function msg(id,t,e){$(id).textContent=t||'';$(id).className='msg'+(e?' err':'')}
function tab(s){$('send').classList.toggle('hidden',!s);$('recv').classList.toggle('hidden',s);$('tS').className=s?'on':'';$('tR').className=s?'':'on'}
$('tS').onclick=function(){tab(true)};$('tR').onclick=function(){tab(false)};
try{$('pw').value=localStorage.getItem('pw')||''}catch(e){}
if(/iPhone|iPad|iPod/.test(navigator.userAgent)){$('dirBtn').classList.add('hidden');$('dropTxt').textContent='Choose files to send'}

var busy=false;
function mk(name,size){var li=document.createElement('li');li.innerHTML='<div class="name"></div><div class="meta"><span class="st">Waiting</span><span></span></div><div class="bar"><i></i></div>';
  li.querySelector('.name').textContent=name;li.querySelectorAll('.meta span')[1].textContent=fmt(size);$('up').insertBefore(li,$('up').firstChild);return li}
function put(code,it,li){return new Promise(function(res,rej){
  var x=new XMLHttpRequest(),t=0;x.open('PUT','/api/up/'+code);
  x.setRequestHeader('X-Password',$('pw').value);x.setRequestHeader('X-Path',encodeURIComponent(it.path));
  x.upload.onprogress=function(e){var n=performance.now();if(n-t<100&&e.loaded<e.total)return;t=n;var p=e.total?e.loaded/e.total*100:100;li.querySelector('.bar i').style.width=p+'%';li.querySelector('.st').textContent='Uploading '+Math.floor(p)+'%'};
  x.onload=function(){if(x.status===200){li.querySelector('.bar i').style.width='100%';li.querySelector('.st').textContent='Uploaded';res()}else rej(new Error('HTTP '+x.status))};
  x.onerror=function(){rej(new Error('network'))};x.send(it.file)})}
async function upload(items){
  if(busy||!items.length)return;
  var pwv=$('pw').value;
  if(!pwv){msg('sMsg','Enter the upload password first.',true);return}
  busy=true;msg('sMsg','Starting\u2026');$('done').classList.add('hidden');
  var code;
  try{
    var r=await fetch('/api/new',{method:'POST',headers:{'X-Password':pwv}});
    if(r.status===401){msg('sMsg','Wrong password.',true);busy=false;return}
    code=(await r.json()).code;try{localStorage.setItem('pw',pwv)}catch(e){}
  }catch(e){msg('sMsg','Could not reach the server.',true);busy=false;return}
  $('codeOut').textContent=code;$('done').classList.remove('hidden');
  $('doneNote').textContent='Publishing\u2026 your friend can enter this code now. Downloads open when publishing finishes.';
  $('cp').onclick=function(){var b=this,l=location.origin+'/#'+code;(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(function(){b.textContent='Copied'},function(){b.textContent=l})};
  for(var i=0;i<items.length;i++){
    var li=mk(items[i].path,items[i].file.size);msg('sMsg','Publishing file '+(i+1)+' of '+items.length+'\u2026');
    try{await put(code,items[i],li)}catch(e){li.querySelector('.st').textContent='Failed: '+e.message;msg('sMsg','Publishing failed. Check your connection and try again.',true);busy=false;return}
  }
  try{
    var d=await fetch('/api/done/'+code,{method:'POST',headers:{'X-Password':pwv}});
    if(!d.ok)throw 0;
    msg('sMsg','Published. Your friend can download now.');$('doneNote').textContent='Published. Your friend can download now.';
  }catch(e){msg('sMsg','Files uploaded but could not finish publishing. Try again.',true)}
  busy=false;
}
$('files').onchange=function(){var l=[].slice.call(this.files).map(function(f){return{file:f,path:f.name}});this.value='';upload(l)};
$('dir').onchange=function(){var l=[].slice.call(this.files).map(function(f){return{file:f,path:f.webkitRelativePath||f.name}});this.value='';upload(l)};
async function walk(en,path,o){
  if(en.isFile){o.push({file:await new Promise(function(r,j){en.file(r,j)}),path:path+en.name});return}
  var rd=en.createReader(),all=[];for(;;){var b=await new Promise(function(r,j){rd.readEntries(r,j)});if(!b.length)break;all=all.concat(b)}
  for(var i=0;i<all.length;i++)await walk(all[i],path+en.name+'/',o);
}
var dz=$('drop');
['dragenter','dragover'].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.add('over')})});
['dragleave','drop'].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.remove('over')})});
dz.addEventListener('drop',async function(e){
  var its=e.dataTransfer.items,ents=[];if(its&&its.length&&its[0].webkitGetAsEntry)for(var i=0;i<its.length;i++){var en=its[i].webkitGetAsEntry();if(en)ents.push(en)}
  var fl=[].slice.call(e.dataTransfer.files),o=[];
  if(ents.length){for(var j=0;j<ents.length;j++)await walk(ents[j],'',o)}else o=fl.map(function(f){return{file:f,path:f.name}});
  upload(o);
});

/* check the server is reachable as soon as the page opens */
(function(){
  function show(t){$('srvNote').textContent=t;$('srvNote').classList.remove('hidden')}
  if(location.protocol==='file:'){show('This page was opened as a file. Open it from your server address instead, for example http://YOUR-SERVER-IP:8080');return}
  fetch('/health',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0}).catch(function(){show('Cannot reach the server at '+location.origin+'. Check that server.js is running and the address and port are correct.')});
})();
/* receive */
var enc=function(p){return p.split('/').map(encodeURIComponent).join('/')};
var poll=null;
async function look(){
  clearTimeout(poll);
  var c=$('codeIn').value.replace(/\D/g,'');if(c.length!==6){msg('rMsg','Enter all 6 digits.',true);return}
  msg('rMsg','Looking\u2026');$('down').innerHTML='';$('zipRow').classList.add('hidden');
  try{
    var r=await fetch('/api/list/'+c);
    if(r.status===429){msg('rMsg','Too many tries. Wait a minute.',true);return}
    if(!r.ok){msg('rMsg','No files for that code. It may be wrong or expired.',true);return}
    var j=await r.json(),n=j.files.length;
    if(!j.done){msg('rMsg','The sender is still publishing ('+n+' file'+(n===1?'':'s')+' so far). This page updates by itself.');poll=setTimeout(look,2500);return}
    msg('rMsg',n+' file'+(n===1?'':'s')+' ready to download.');
    j.files.forEach(function(f){var li=document.createElement('li'),a=document.createElement('a');
      li.innerHTML='<div class="name"></div><div class="meta"><span></span><span></span></div>';
      li.querySelector('.name').textContent=f.path;li.querySelectorAll('.meta span')[1].textContent=fmt(f.size);
      a.href='/d/'+c+'/'+enc(f.path);a.textContent='Download';li.querySelectorAll('.meta span')[0].appendChild(a);$('down').appendChild(li)});
    if(n>1){$('zipA').href='/zip/'+c;$('zipRow').classList.remove('hidden')}
  }catch(e){msg('rMsg','Could not reach the server.',true)}
}
$('look').onclick=look;$('codeIn').addEventListener('keydown',function(e){if(e.key==='Enter')look()});
if(/^#\d{6}$/.test(location.hash)){tab(false);$('codeIn').value=location.hash.slice(1);look()}
})();
</script></body></html>
